<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap">
  <style>
    body { margin: 0; font-family: "Bricolage Grotesque", "PingFang TC", ui-sans-serif, system-ui, sans-serif; }
    a { color: #de5c1f; } a:hover { color: #c04f18; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    /* One disc. No box around it — the only edges are the screen's. */
    .disc {
      position: absolute; border-radius: 50%;
      background:
        linear-gradient(135deg, rgb(255 255 255 / .55), rgb(255 255 255 / 0) 42%, rgb(222 92 31 / .07)),
        repeating-conic-gradient(from 90deg, #f6f2ec 0deg 1.6deg, transparent 1.6deg 40deg),
        conic-gradient(from 90deg,
          rgb(255 255 255 / .78) 0deg 40deg, rgb(255 255 255 / .40) 40deg 80deg,
          rgb(255 255 255 / .78) 80deg 120deg, rgb(255 255 255 / .40) 120deg 160deg,
          rgb(255 255 255 / .78) 160deg 200deg, rgb(255 255 255 / .40) 200deg 240deg,
          rgb(255 255 255 / .78) 240deg 280deg, rgb(255 255 255 / .40) 280deg 320deg,
          rgb(255 255 255 / .40) 320deg 360deg);
      box-shadow: inset 0 0 0 1px rgb(20 22 28 / .10);
    }
    .ray { position: absolute; inset: 0; transform-origin: 50% 50%; }
    .name {
      position: absolute; left: 50%; white-space: nowrap; top: 118px;
      transform-origin: 50% 50%;
      font-size: 26px; font-weight: 500; letter-spacing: .02em; color: #2e2a27;
    }
    /* Readable means the text baseline lands inside (-90deg, 90deg) once the
       ray rotation is added, so the two sides of the pointer flip opposite
       ways. In the app this is labelRay()'s `flipped`, computed per label. */
    .name.l { transform: translateX(-50%) rotate(90deg); }
    .name.r { transform: translateX(-50%) rotate(-90deg); }
    .far { filter: blur(4px); color: #6f6862; }
    .hub {
      position: absolute; left: 50%; top: 50%; width: 207px; height: 207px;
      margin: -103.5px 0 0 -103.5px; border-radius: 50%; background: #fbf7f2;
      box-shadow: 0 2px 12px rgb(20 22 28 / .06);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(160deg, #f6f2ec 0%, #efe8df 55%, #e7ded2 100%);">

  <!-- Everything except the wheel recedes: lifted 12px, blurred 1.6px, half opacity. -->
  <div style="filter: blur(1.6px); opacity: .5; transform: translateY(-12px);">
    <div style="height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: rgb(255 255 255 / .36); backdrop-filter: blur(16px) saturate(1.9); box-shadow: inset 0 -1px 0 rgb(255 255 255 / .95);">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 28px; height: 28px; border-radius: 50%; background: conic-gradient(from 337.5deg, #de5c1f 0deg 45deg, rgb(255 255 255 / .4) 45deg 90deg, rgb(255 255 255 / .78) 90deg 135deg, rgb(255 255 255 / .4) 135deg 180deg, rgb(255 255 255 / .78) 180deg 225deg, rgb(255 255 255 / .4) 225deg 270deg, rgb(255 255 255 / .78) 270deg 315deg, rgb(255 255 255 / .4) 315deg 360deg), #f6f2ec; box-shadow: inset 0 0 0 1px rgb(20 22 28 / .1);"></div>
        <span style="font-size: 17px; font-weight: 600; letter-spacing: -.02em; color: #2e2a27;">Lunch Wheel</span>
      </div>
      <div style="width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #de5c1f, #f0894a);"></div>
    </div>
    <div style="display: flex; gap: 8px; padding: 12px 12px 4px;">
      <div style="flex: 1; height: 56px; border-radius: 22px; background: rgb(255 255 255 / .36); backdrop-filter: blur(16px) saturate(1.9);"></div>
      <div style="width: 56px; height: 56px; border-radius: 22px; background: rgb(255 255 255 / .36); backdrop-filter: blur(16px) saturate(1.9);"></div>
    </div>
  </div>

  <!-- THE FIX. 741px disc (1.9x the 390 frame), centred on x, top edge at the
       pointer's reading line. No wrapper, no overflow:clip, no box — it simply
       runs off three sides of the screen the way a big circle does. -->
  <div class="disc" style="width: 741px; height: 741px; left: -175px; top: 44px;">
    <div class="ray" style="transform: rotate(0deg);"><span class="name l">Noodle&nbsp;House</span></div>
    <div class="ray" style="transform: rotate(-40deg);"><span class="name l">Salad&nbsp;Bar</span></div>
    <div class="ray" style="transform: rotate(40deg);"><span class="name r">Thai&nbsp;Garden</span></div>
    <div class="ray" style="transform: rotate(-80deg);"><span class="name l far">Sandwich&nbsp;Shop</span></div>
    <div class="ray" style="transform: rotate(80deg);"><span class="name r far">Taco&nbsp;Truck</span></div>
    <!-- The hub rides the disc centre, which at this zoom sits mid-screen. -->
    <div class="hub">
      <span style="font-size: 44px; font-weight: 600; letter-spacing: -.04em; line-height: 1; color: #0d0f14;">9</span>
      <span style="font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #de5c1f; margin-top: 5px;">in play</span>
    </div>
  </div>

  <!-- Pointer, top centre, biting into the rim. -->
  <svg width="32" height="30" viewBox="0 0 32 30" fill="none" style="position: absolute; left: 195px; top: 44px; transform: translate(-50%, -50%);">
    <path d="M16 29L3 3L29 3Z" fill="#de5c1f" stroke="#fbf7f2" stroke-width="1.5" stroke-linejoin="round"></path>
  </svg>

  <!-- The dock keeps its own layer above the disc; the disc passes behind it,
       which is the first time this glass has had anything to refract. -->
  <div style="position: absolute; left: 12px; right: 12px; bottom: 20px; padding: 6px; border-radius: 34px; display: flex; gap: 4px; background: rgb(255 255 255 / .36); backdrop-filter: blur(16px) saturate(1.9); box-shadow: inset 0 1px 0 rgb(255 255 255 / .95), inset 0 -1px 0 rgb(255 255 255 / .35), 0 1px 2px rgb(20 22 28 / .1), 0 8px 20px rgb(20 22 28 / .1), 0 20px 44px rgb(20 22 28 / .07);">
    <div style="flex: 1; height: 56px; border-radius: 26px; background: linear-gradient(135deg, #de5c1f, #f0894a); color: #fbf7f2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; letter-spacing: .05em;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 3v6h-6"></path></svg>
      Wheel
    </div>
    <div style="flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; letter-spacing: .05em; color: #6f6862;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v9a2 2 0 0 0 4 0V3"></path><path d="M9 12v9"></path><path d="M17 3c-1.5 2-2 4-2 6h4c0-2-.5-4-2-6Z"></path><path d="M17 9v12"></path></svg>
      Restaurants
    </div>
    <div style="flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; letter-spacing: .05em; color: #6f6862;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 3v6h6"></path><path d="M12 8v4l3 2"></path></svg>
      History
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
