<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap">
  <style>
    body { margin: 0; font-family: "Bricolage Grotesque", "PingFang TC", ui-sans-serif, system-ui, sans-serif; }
    a { color: #de5c1f; } a:hover { color: #c04f18; }
    .tag {
      position: absolute; z-index: 5; background: #b3261e; color: #fff;
      font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      padding: 5px 9px; border-radius: 6px; white-space: nowrap;
    }
    .tag::after {
      content: ""; position: absolute; left: 14px; top: 100%;
      border: 5px solid transparent; border-top-color: #b3261e;
    }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(160deg, #f6f2ec 0%, #efe8df 55%, #e7ded2 100%);">

  <div style="filter: blur(1.6px); opacity: .5;">
    <div style="height: 64px; background: rgb(255 255 255 / .36);"></div>
    <div style="display: flex; gap: 8px; padding: 12px 12px 4px;">
      <div style="flex: 1; height: 56px; border-radius: 22px; background: rgb(255 255 255 / .36);"></div>
      <div style="width: 56px; height: 56px; border-radius: 22px; background: rgb(255 255 255 / .36);"></div>
    </div>
  </div>

  <!-- What ships today: the 741px disc lives inside a 390x329 box with
       overflow:clip. A circle clipped to a rectangle is a rectangle. -->
  <div style="position: absolute; left: 0; top: 140px; width: 390px; height: 329px; overflow: hidden; outline: 2px dashed #b3261e; outline-offset: -1px;">
    <div style="position: absolute; width: 741px; height: 741px; left: -175px; top: 0; border-radius: 50%;
      background:
        linear-gradient(135deg, rgb(255 255 255 / .55), rgb(255 255 255 / 0) 42%, rgb(222 92 31 / .07)),
        repeating-conic-gradient(from 90deg, #f6f2ec 0deg 1.6deg, transparent 1.6deg 40deg),
        conic-gradient(from 90deg,
          rgb(255 255 255 / .78) 0deg 40deg, rgb(255 255 255 / .40) 40deg 80deg,
          rgb(255 255 255 / .78) 80deg 120deg, rgb(255 255 255 / .40) 120deg 160deg,
          rgb(255 255 255 / .78) 160deg 200deg, rgb(255 255 255 / .40) 200deg 240deg,
          rgb(255 255 255 / .78) 240deg 280deg, rgb(255 255 255 / .40) 280deg 320deg,
          rgb(255 255 255 / .40) 320deg 360deg);">
    </div>
  </div>
  <div class="tag" style="left: 16px; top: 112px;">The square: overflow clip</div>

  <div style="position: absolute; left: 16px; right: 16px; top: 500px; height: 56px; border-radius: 22px; background: rgb(231 222 210 / .7); display: flex; align-items: center; justify-content: center; font-size: 16px; color: #9aa1aa;">Spinning…</div>

  <!-- The result today: no panel at all, just a scrim, so the Spin button
       underneath shows straight through the copy. -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: linear-gradient(to top, #efe8df 22%, rgb(239 232 223 / .82) 46%, transparent 78%); padding: 0 24px;">
    <div style="position: absolute; left: 24px; bottom: 190px;">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #de5c1f; margin-bottom: 8px;">Today&#39;s lunch</div>
      <div style="font-size: 56px; line-height: 1.04; font-weight: 600; letter-spacing: -.02em; color: #c04f18;">Taco Truck</div>
    </div>
    <div style="position: absolute; left: 24px; right: 24px; bottom: 96px; height: 56px; border-radius: 22px; background: linear-gradient(135deg, #de5c1f, #f0894a);"></div>
    <div style="position: absolute; left: 24px; right: 24px; bottom: 26px; display: flex; gap: 10px;">
      <div style="flex: 1; height: 56px; border-radius: 22px; background: rgb(255 255 255 / .44);"></div>
      <div style="flex: 1; height: 56px; border-radius: 22px; background: rgb(255 255 255 / .44);"></div>
    </div>
  </div>
  <div class="tag" style="left: 200px; top: 476px;">Scrim, not a panel</div>
  <div class="tag" style="left: 16px; top: 700px;">Glass on flat ground = flat</div>
</div>
</x-dc>
</body>
</html>
