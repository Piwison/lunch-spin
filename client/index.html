<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Cinematic Lunch Wheel</title>
    <meta name="theme-color" content="#efe8df" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lunch Wheel" />
    <!-- Bricolage Grotesque is self-hosted (client/public/fonts), so there are no
         third-party font hosts to preconnect to and no stylesheet round trip
         before the font is even discovered. One variable file covers weights
         400-800; latin is preloaded because it is on every first paint, while
         latin-ext and vietnamese load only if a restaurant name needs them. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/bricolage-latin.woff2"
      crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics is injected from main.tsx, only when its env vars are set. -->
  </body>

</html>
