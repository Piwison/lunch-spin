<!doctype html>
<html lang="zh-Hant-TW">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- ── Search / social ──────────────────────────────────────────────────
         This is a client-rendered SPA and vercel.json rewrites every non-/api
         path to THIS file, so everything below is what a crawler sees for every
         route. LINE, Facebook and Slack do not execute JavaScript, which is why
         a shared link used to preview as a bare URL with no title and no image.
         The copy is therefore written for the landing page — a wheel-specific
         title for /w/:id needs the meta rendered server-side, which is a
         separate change.

         `__SITE_ORIGIN__` is resolved at build time by seoOriginPlugin in
         vite.config.ts (VITE_SITE_ORIGIN, else the default deploy host). -->
    <title>中午吃什麼？午餐轉盤一轉就決定 · Lunch Wheel</title>
    <meta
      name="description"
      content="辦公室午餐的選擇障礙終結者。定位一次，自動帶出走得到的餐廳，一鍵建好轉盤分享給同事；最近吃過的會自動跳過。免費、免安裝，不用登入就能先轉一次。" />
    <link rel="canonical" href="__SITE_ORIGIN__/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lunch Wheel 午餐轉盤" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="__SITE_ORIGIN__/" />
    <meta property="og:title" content="中午吃什麼？交給轉盤決定" />
    <meta
      property="og:description"
      content="定位 → 勾選附近餐廳 → 開轉。最近吃過的自動跳過，午餐不用再吵「都可以」。" />
    <meta property="og:image" content="__SITE_ORIGIN__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lunch Wheel 午餐轉盤：定位、勾選附近餐廳、開轉" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="中午吃什麼？交給轉盤決定" />
    <meta
      name="twitter:description"
      content="定位 → 勾選附近餐廳 → 開轉。最近吃過的自動跳過，午餐不用再吵「都可以」。" />
    <meta name="twitter:image" content="__SITE_ORIGIN__/og.png" />

    <!-- An invite link (/join/:token) carries a bearer token in the path, so it
         must not travel in a Referer header to another origin. Chromium already
         defaults to this; stating it covers the browsers that do not. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta name="theme-color" content="#efe8df" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="午餐轉盤" />

    <!-- Bricolage Grotesque is self-hosted (client/public/fonts), so there are no
         third-party font hosts to preconnect to and no stylesheet round trip
         before the font is even discovered. One variable file covers weights
         400-800; latin is preloaded because it is on every first paint, while
         latin-ext and vietnamese load only if a restaurant name needs them. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/bricolage-latin.woff2"
      crossorigin />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Lunch Wheel 午餐轉盤",
        "url": "__SITE_ORIGIN__/",
        "description": "團隊午餐決策工具：定位一次自動帶出走得到的餐廳，建立轉盤分享給同事，最近吃過的自動跳過。",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any",
        "inLanguage": ["zh-Hant-TW", "en"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TWD" }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics is injected from main.tsx, only when its env vars are set. -->
  </body>

</html>
